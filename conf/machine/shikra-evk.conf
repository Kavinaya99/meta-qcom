#@TYPE: Machine
#@NAME: Qualcomm Shikra Alpha Evaluation Kit (EVK)
#@DESCRIPTION: Machine configuration for Qualcomm Shikra Evaluation Kit (EVK)

require conf/machine/include/qcom-shikra.inc

MACHINE_FEATURES += "efi pci m2connector phone tpm2"

KERNEL_DEVICETREE ?= " \
                      qcom/shikra-cqm-evk.dtb \
                      qcom/shikra-cqs-evk.dtb \
                      qcom/shikra-iqs-evk.dtb \
                      qcom/shikra-cqm-evk-imx577-camera.dtbo \
                      qcom/shikra-iqs-evk-imx577-camera.dtbo \
                      qcom/shikra-cqm-cqs-evk-hdmi.dtbo \
                      qcom/shikra-iqs-evk-dlc-panel.dtbo \
                      qcom/shikra-iqs-evk-lvds-auo,g133han01.dtbo \
                      "

LINUX_QCOM_KERNEL_DEVICETREE ?= " \
                      qcom/shikra-cqs-evk-camx.dtbo \
                      qcom/shikra-iqs-evk-camx.dtbo \
                      qcom/shikra-cqm-evk-camx.dtbo \
                      "

MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS += " \
    packagegroup-shikra-evk-firmware \
    packagegroup-shikra-evk-hexagon-dsp-binaries \
    qcom-fastcv-binaries-shikra-evk-dsp \
"

QCOM_CDT_FILE = "cdt_cq2390_itp_0.2.0"
QCOM_BOOT_FILES_SUBDIR = "shikra"
QCOM_PARTITION_FILES_SUBDIR ?= "partitions/shikra-evk/emmc"

QCOM_BOOT_FIRMWARE = "firmware-qcom-boot-shikra"
QCOM_CDT_FIRMWARE = "firmware-qcom-cdt-shikra"

UBOOT_CONFIG = "shikra-evk"
UBOOT_CONFIG[shikra-evk] = "qcom_shikra_spl_defconfig"

# MBN header version for SPL signing
BOARD_MBN_HEADER[shikra-evk] = "v6"

EXTRA_IMAGEDEPENDS += "trusted-firmware-a-qcom-shikra boot-fit-shikra"

MACHINE_EXTRA_RRECOMMENDS += "${@bb.utils.contains('BBFILE_COLLECTIONS', 'meta-arm', 'packagegroup-optee', '', d)}"

SPL_BINARY = "spl/u-boot-spl.bin"
PREFERRED_PROVIDER_virtual/bootloader = "u-boot-qcom"
